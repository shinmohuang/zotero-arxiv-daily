name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # Keep this schedule definition explicit so a workflow file update
    # forces GitHub Actions to refresh the registered cron trigger.
    - cron: '0 05 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # 缓存 HuggingFace 模型（reranker），避免每次重新下载、规避 HF 429 限流。
      # 每日定时跑会每天命中缓存，不会被 7 天未访问的驱逐策略清掉。
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/base.yaml') }}
          restore-keys: |
            hf-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          HF_HOME: /home/runner/.cache/huggingface
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
